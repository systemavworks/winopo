name: winopo-staging

# Datos sintéticos. Nunca alumnos reales.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: winopo
      POSTGRES_USER: winopo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - staging-db:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m

  core:
    build: { context: .., dockerfile: core/Dockerfile }
    environment:
      WINOPO_PROFILE: api
      APP_ENV: staging
      # Mismo esquema que producción: rol de aplicación sin BYPASSRLS.
      DATABASE_URL: jdbc:postgresql://db:5432/winopo?user=winopo_app&password=${POSTGRES_APP_PASSWORD:?falta POSTGRES_APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET}
    depends_on: [db]
    restart: unless-stopped
    mem_limit: 768m

  worker:
    build: { context: .., dockerfile: core/Dockerfile }
    environment:
      WINOPO_PROFILE: worker
      APP_ENV: staging
      DATABASE_URL: jdbc:postgresql://db:5432/winopo?user=winopo_app&password=${POSTGRES_APP_PASSWORD:?falta POSTGRES_APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET}
    depends_on: [db]
    restart: unless-stopped
    # El perfil `worker` no abre puerto: el HEALTHCHECK de la imagen (8080/healthz) fallaría
    # siempre y lo dejaría en «unhealthy» sin que hubiera nada roto.
    healthcheck:
      disable: true
    mem_limit: 768m

  web:
    build: { context: .., dockerfile: web/Dockerfile }
    environment:
      WINOPO_API_URL: http://core:8080
      PORT: 3000
    depends_on: [core]
    restart: unless-stopped
    mem_limit: 384m

  caddy:
    image: caddy:2-alpine
    environment:
      WINOPO_DOMINIO: staging.winopo.es
    ports: ["80:80", "443:443"]
    volumes:
      # Staging no sirve el landing: un solo dominio y un solo bloque.
      - ./caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [core, web]
    restart: unless-stopped
    mem_limit: 128m

volumes:
  staging-db:
  caddy-data:
